name: Finalize portfolio projects

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-portfolio-projects.yml

permissions:
  contents: write

jobs:
  finalize-portfolio:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tools
        run: |
          python -m pip install --disable-pip-version-check pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core

      - name: Mask sensitive portfolio data and update statuses
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import math

          ROOT = Path('.')
          ASSETS = ROOT / 'docs' / 'assets' / 'projects'
          SCHOOL = ASSETS / 'rock-foundation-college-dashboard.png'
          RETAIL = ASSETS / 'buy-and-use-dashboard.png'
          FONT_REG = '/usr/share/fonts/truetype/dejavu/DejaVuSansCondensed.ttf'
          FONT_BOLD = '/usr/share/fonts/truetype/dejavu/DejaVuSansCondensed-Bold.ttf'

          def f(size, bold=False):
              return ImageFont.truetype(FONT_BOLD if bold else FONT_REG, size)

          def center_text(draw, box, text, font, fill):
              x1, y1, x2, y2 = box
              bounds = draw.textbbox((0, 0), text, font=font)
              width = bounds[2] - bounds[0]
              height = bounds[3] - bounds[1]
              x = x1 + (x2 - x1 - width) / 2
              y = y1 + (y2 - y1 - height) / 2 - bounds[1]
              draw.text((x, y), text, font=font, fill=fill)

          def protected_metric(draw, box, background, ink, muted):
              x1, y1, x2, y2 = box
              draw.rectangle(box, fill=background)
              center_text(draw, (x1, y1 + 2, x2, y1 + 42), '••••', f(30, True), ink)
              center_text(draw, (x1, y1 + 39, x2, y2), 'Protected value', f(13), muted)

          def build_school():
              image = Image.open(SCHOOL).convert('RGB')
              draw = ImageDraw.Draw(image)

              header = (255, 254, 250)
              card = (255, 254, 251)
              line = (230, 225, 216)
              ink = (5, 78, 50)
              text = (24, 31, 29)
              muted = (82, 83, 79)
              soft = (232, 238, 230)
              soft_line = (202, 214, 201)
              dark = (14, 66, 41)
              white = (248, 248, 242)

              # Header identities and notifications.
              draw.rectangle((950, 0, 1531, 100), fill=header)
              draw.text((1058, 35), 'Campus protected', font=f(16, True), fill=text)
              draw.text((1281, 27), 'Authorized user', font=f(17, True), fill=text)
              draw.text((1281, 57), 'Role protected', font=f(14), fill=muted)
              draw.line((1260, 25, 1260, 77), fill=line, width=1)

              # Development status.
              draw.rectangle((1125, 125, 1502, 207), fill=header)
              draw.rounded_rectangle((1150, 141, 1483, 194), radius=11, fill=(252, 249, 241), outline=(225, 216, 200), width=1)
              center_text(draw, (1162, 141, 1471, 194), 'Development build  •  Data masked', f(15), text)

              # Summary metrics.
              for box in ((376, 295, 553, 372), (674, 295, 852, 372), (971, 295, 1149, 372), (1266, 295, 1457, 372)):
                  protected_metric(draw, box, card, ink, muted)

              # Payment table values and identifiers.
              row_tops = (548, 625, 702, 779, 856)
              columns = ((347, 455), (459, 572), (579, 671), (676, 769), (781, 871))
              values = ('Protected', 'Protected', '•••', '₦•••••', '•• •••')
              sizes = (14, 14, 15, 15, 15)
              for top in row_tops:
                  draw.rectangle((343, top, 1014, top + 66), fill=card)
                  draw.line((343, top + 65, 1014, top + 65), fill=line, width=1)
                  for (x1, x2), value, size in zip(columns, values, sizes):
                      color = muted if value == 'Protected' else text
                      center_text(draw, (x1, top + 14, x2, top + 50), value, f(size, value in ('•••', '₦•••••')), color)
                  draw.rounded_rectangle((858, top + 16, 1001, top + 50), radius=7, fill=soft, outline=soft_line, width=1)
                  center_text(draw, (858, top + 16, 1001, top + 50), 'Protected', f(12, True), ink)

              # Financial chart with no real totals or ratios.
              draw.rounded_rectangle((1024, 424, 1478, 728), radius=14, fill=card, outline=line, width=1)
              draw.text((1043, 447), 'Fee Collection Overview', font=f(24, True), fill=text)
              draw.text((1043, 480), 'Sensitive financial values are hidden.', font=f(14), fill=muted)
              cx, cy = 1138, 586
              draw.ellipse((1062, 510, 1214, 662), fill=(11, 125, 69))
              draw.ellipse((1095, 543, 1181, 629), fill=card)
              for angle in (0, 90, 180, 270):
                  inner, outer = 43, 77
                  x1 = cx + math.cos(math.radians(angle)) * inner
                  y1 = cy + math.sin(math.radians(angle)) * inner
                  x2 = cx + math.cos(math.radians(angle)) * outer
                  y2 = cy + math.sin(math.radians(angle)) * outer
                  draw.line((x1, y1, x2, y2), fill=card, width=5)
              center_text(draw, (1094, 555, 1182, 617), 'PRIVATE', f(14, True), ink)

              legend_y = 520
              for label, color in (('Collected', (11, 125, 69)), ('Pending', (241, 209, 128)), ('Total', (211, 149, 0))):
                  draw.ellipse((1234, legend_y, 1253, legend_y + 19), fill=color)
                  draw.text((1266, legend_y - 3), label, font=f(18), fill=text)
                  draw.rounded_rectangle((1370, legend_y - 1, 1455, legend_y + 22), radius=5, fill=soft, outline=soft_line, width=1)
                  center_text(draw, (1370, legend_y - 1, 1455, legend_y + 22), 'MASKED', f(11, True), muted)
                  legend_y += 48

              draw.text((1044, 689), 'Portfolio-safe view', font=f(14, True), fill=ink)
              draw.text((1300, 689), 'Current term protected', font=f(13), fill=muted)

              # Session information.
              draw.rounded_rectangle((9, 871, 247, 966), radius=10, fill=dark, outline=(93, 137, 105), width=1)
              draw.text((23, 885), 'Current term', font=f(14, True), fill=white)
              draw.text((23, 913), 'Session protected', font=f(13, True), fill=white)
              draw.text((23, 939), 'Internal term hidden', font=f(11), fill=(213, 226, 216))
              draw.rounded_rectangle((205, 908, 230, 936), radius=3, outline=white, width=2)
              draw.line((205, 916, 230, 916), fill=white, width=2)
              draw.line((211, 904, 211, 912), fill=white, width=2)
              draw.line((224, 904, 224, 912), fill=white, width=2)

              image.save(SCHOOL, optimize=True)

          def draw_receipt(draw, x, y, ink, soft):
              draw.rounded_rectangle((x, y, x + 42, y + 50), radius=7, fill=soft)
              draw.rectangle((x + 13, y + 10, x + 29, y + 34), outline=ink, width=3)
              draw.line((x + 17, y + 17, x + 26, y + 17), fill=ink, width=2)
              draw.line((x + 17, y + 23, x + 26, y + 23), fill=ink, width=2)
              draw.line((x + 17, y + 29, x + 24, y + 29), fill=ink, width=2)

          def build_retail():
              image = Image.open(RETAIL).convert('RGB')
              draw = ImageDraw.Draw(image)

              header = (255, 254, 250)
              card = (255, 254, 251)
              bottom = (248, 250, 243)
              line = (230, 225, 216)
              ink = (5, 78, 50)
              text = (24, 31, 29)
              muted = (82, 83, 79)
              soft = (232, 238, 230)
              soft_line = (202, 214, 201)
              dark = (14, 66, 41)
              white = (248, 248, 242)

              # Header identities and notifications.
              draw.rectangle((870, 0, 1531, 104), fill=header)
              draw.text((895, 28), 'Development build', font=f(17, True), fill=text)
              draw.text((895, 58), 'Sensitive values and identifiers masked', font=f(13), fill=muted)
              draw.line((1277, 22, 1277, 80), fill=line, width=1)
              draw.text((1300, 27), 'Authorized user', font=f(17, True), fill=text)
              draw.text((1300, 57), 'Location protected', font=f(14), fill=muted)

              # Summary metrics.
              for box in ((378, 184, 557, 267), (683, 184, 862, 267), (979, 184, 1154, 267), (1277, 184, 1456, 267)):
                  protected_metric(draw, box, card, ink, muted)

              # Branch performance table.
              draw.rectangle((298, 443, 925, 702), fill=card)
              for top in (449, 531, 613):
                  draw.ellipse((300, top + 23, 313, top + 36), fill=(5, 151, 82))
                  draw.text((325, top + 12), 'Protected branch', font=f(14, True), fill=text)
                  draw.text((325, top + 36), 'Identifier hidden', font=f(11), fill=muted)
                  center_text(draw, (416, top + 10, 517, top + 53), '₦••••', f(15, True), text)
                  center_text(draw, (525, top + 10, 620, top + 53), 'Protected', f(12), muted)
                  center_text(draw, (640, top + 10, 716, top + 53), '•••', f(16, True), text)
                  center_text(draw, (730, top + 10, 824, top + 53), '₦••••', f(15, True), text)
                  center_text(draw, (838, top + 10, 913, top + 53), '••%', f(15, True), text)
                  draw.line((298, top + 71, 925, top + 71), fill=line, width=1)

              # Recent POS activity.
              draw.rectangle((970, 374, 1484, 752), fill=card)
              methods = ('Card payment', 'Cash payment', 'Transfer payment', 'Card payment', 'Cash payment')
              for top, method in zip((381, 458, 535, 612, 689), methods):
                  draw_receipt(draw, 980, top + 1, ink, (239, 244, 234))
                  draw.text((1035, top + 7), 'Protected branch', font=f(14, True), fill=text)
                  draw.text((1035, top + 31), method, font=f(13), fill=text)
                  draw.rounded_rectangle((1327, top + 7, 1421, top + 31), radius=6, fill=soft, outline=soft_line, width=1)
                  center_text(draw, (1327, top + 7, 1421, top + 31), '₦••••', f(13, True), ink)
                  draw.text((1339, top + 36), 'Completed', font=f(13), fill=(0, 118, 61))
                  draw.ellipse((1442, top + 15, 1456, top + 29), fill=(5, 151, 82))
                  draw.line((970, top + 67, 1478, top + 67), fill=line, width=1)
              draw.line((1478, 374, 1478, 752), fill=line, width=1)

              # Bottom operational metrics.
              bottom_specs = (
                  ((371, 838, 558, 966), 'TOTAL TRANSACTIONS'),
                  ((674, 838, 858, 966), 'ACTIVE CASHIERS'),
                  ((969, 838, 1162, 966), 'AVG BASKET SIZE'),
                  ((1260, 838, 1468, 966), 'LOW STOCK ALERTS'),
              )
              for box, heading in bottom_specs:
                  x1, y1, x2, y2 = box
                  draw.rectangle(box, fill=bottom)
                  center_text(draw, (x1, y1, x2, y1 + 32), heading, f(14, True), text)
                  center_text(draw, (x1, y1 + 32, x2, y1 + 80), '••••', f(28, True), ink)
                  center_text(draw, (x1, y1 + 79, x2, y2), 'Protected value', f(12), muted)

              # Region selector with no country or branch identifier.
              draw.rounded_rectangle((9, 850, 239, 942), radius=10, fill=dark, outline=(93, 137, 105), width=1)
              draw.ellipse((25, 873, 61, 909), outline=white, width=2)
              draw.line((43, 873, 43, 909), fill=white, width=1)
              draw.arc((31, 873, 55, 909), 90, 270, fill=white, width=1)
              draw.arc((31, 873, 55, 909), 270, 90, fill=white, width=1)
              draw.line((27, 891, 59, 891), fill=white, width=1)
              draw.text((77, 871), 'Region protected', font=f(14, True), fill=white)
              draw.text((77, 900), 'All locations', font=f(12), fill=(213, 226, 216))

              image.save(RETAIL, optimize=True)

          def update_section(text, start_marker, end_marker, replacements, label):
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              section = text[start:end]
              for old, new, expected in replacements:
                  count = section.count(old)
                  if count != expected:
                      raise RuntimeError(f'{label}: expected {expected}, found {count}: {old}')
                  section = section.replace(old, new)
              return text[:start] + section + text[end:]

          def update_readme():
              path = ROOT / 'README.md'
              text = path.read_text(encoding='utf-8')
              text = update_section(
                  text,
                  '### Dera Auto — vehicle inventory and operations',
                  '### SupreTek Suite CRM — business operations platform',
                  (
                      ('Dera Auto dashboard mockup', 'Dera Auto deployed dashboard', 1),
                      ('*Anonymized interface mockup based on the development build. Internal values and identifiers are masked.*', '*Anonymized screenshot from the deployed system. Internal values and identifiers are masked.*', 1),
                      ('- **Status:** Development build.', '- **Status:** Deployed.', 1),
                  ),
                  'README Dera Auto',
              )
              text = update_section(
                  text,
                  '### SupreTek Suite CRM — business operations platform',
                  '### Rock Foundation College — school management system',
                  (
                      ('SupreTek Suite CRM dashboard mockup', 'SupreTek Suite CRM deployed dashboard', 1),
                      ('*Anonymized interface mockup based on the development build. Internal values and identifiers are masked.*', '*Anonymized screenshot from the deployed system. Internal values and identifiers are masked.*', 1),
                      ('- **Status:** In development.', '- **Status:** Deployed.', 1),
                  ),
                  'README SupreTek Suite',
              )
              text = update_section(
                  text,
                  '### Rock Foundation College — school management system',
                  '### Buy and Use — retail operations system',
                  (
                      ('*Anonymized interface mockup based on the development build. Sample data is used.*', '*Portfolio-safe screenshot from the development build. Sensitive values and identifiers are masked.*', 1),
                  ),
                  'README Rock Foundation College',
              )
              text = update_section(
                  text,
                  '### Buy and Use — retail operations system',
                  '### More work',
                  (
                      ('*Anonymized interface mockup based on the development build. Sample data is used.*', '*Portfolio-safe screenshot from the development build. Sensitive values and identifiers are masked.*', 1),
                  ),
                  'README Buy and Use',
              )
              path.write_text(text, encoding='utf-8')

          def update_html(path):
              text = path.read_text(encoding='utf-8')
              text = update_section(
                  text,
                  '<article class="project" id="dera-auto">',
                  '<article class="project" id="supretek-suite">',
                  (
                      ('<span class="status">Development build</span>', '<span class="status">Deployed</span>', 1),
                      ('View Dera Auto dashboard mockup at full size', 'View Dera Auto deployed dashboard at full size', 1),
                      ('Anonymized mockup based on the development build. Select the image to enlarge.', 'Anonymized screenshot from the deployed system. Sensitive values and identifiers are masked. Select the image to enlarge.', 1),
                  ),
                  f'{path} Dera Auto',
              )
              text = update_section(
                  text,
                  '<article class="project" id="supretek-suite">',
                  '<article class="project" id="rock-foundation-college">',
                  (
                      ('<span class="status">In development</span>', '<span class="status">Deployed</span>', 1),
                      ('View SupreTek Suite CRM dashboard mockup at full size', 'View SupreTek Suite CRM deployed dashboard at full size', 1),
                      ('Anonymized mockup based on the development build. Select the image to enlarge.', 'Anonymized screenshot from the deployed system. Sensitive values and identifiers are masked. Select the image to enlarge.', 1),
                  ),
                  f'{path} SupreTek Suite',
              )
              text = update_section(
                  text,
                  '<article class="project" id="rock-foundation-college">',
                  '<article class="project" id="buy-and-use">',
                  (
                      ('Rock Foundation College school management dashboard showing student numbers, collected and pending fees, report cards, and sample parent payments.', 'Rock Foundation College school management dashboard with sensitive values and identifiers masked for portfolio display.', 1),
                      ('Anonymized interface mockup based on the development build. Sample data is used.', 'Portfolio-safe screenshot from the development build. Sensitive values and identifiers are masked.', 1),
                  ),
                  f'{path} Rock Foundation College',
              )
              # Buy and Use is the final project card, so scope it through the project grid close.
              text = update_section(
                  text,
                  '<article class="project" id="buy-and-use">',
                  '      </div>\n      <p class="other-work">',
                  (
                      ('Buy and Use retail operations dashboard with sample branch sales, POS activity, stock levels, expiry alerts and performance indicators.', 'Buy and Use retail operations dashboard with sensitive values and identifiers masked for portfolio display.', 1),
                      ('Anonymized interface mockup based on the development build. Sample data is used.', 'Portfolio-safe screenshot from the development build. Sensitive values and identifiers are masked.', 1),
                  ),
                  f'{path} Buy and Use',
              )
              text = text.replace(
                  'Buy and Use retail operations dashboard with sample sales, stock, and branch reporting data.',
                  'Buy and Use retail operations dashboard with sensitive values and identifiers masked.',
              )
              path.write_text(text, encoding='utf-8')

          build_school()
          build_retail()
          update_readme()
          update_html(ROOT / 'index.html')
          update_html(ROOT / 'docs' / 'index.html')
          PY

      - name: Validate and commit final portfolio updates
        shell: bash
        run: |
          rm -f .github/workflows/finalize-portfolio-projects.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Mask portfolio data and mark deployed projects"
          git push origin HEAD:main
