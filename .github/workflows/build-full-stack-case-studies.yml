name: Build full-stack portfolio case studies

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-full-stack-case-studies.yml

permissions:
  contents: write

jobs:
  build-case-studies:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build internal case-study pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          ROOT = Path('.')
          DOCS = ROOT / 'docs'
          PROJECTS = DOCS / 'projects'
          PROJECTS.mkdir(parents=True, exist_ok=True)

          EMAIL = 'dardtechsystems@outlook.com'
          LINKEDIN = 'https://www.linkedin.com/in/harrison-madu-7555b3349'
          PORTFOLIO = '/Portfolio/'

          def clean(value: str) -> str:
              return textwrap.dedent(value).strip()

          def bullet_list(items):
              return '<ul>' + ''.join(f'<li>{item}</li>' for item in items) + '</ul>'

          def section(title, body):
              return f'''<section class="case-section">
                <h2>{title}</h2>
                {body}
              </section>'''

          def render_page(*, slug, title, eyebrow, summary, status, role, focus, timeframe,
                          visual, sections, stack, responsibilities, scope_note, related_href=None,
                          related_label=None):
              related = ''
              if related_href and related_label:
                  related = f'<a class="text-link" href="{related_href}">{related_label} ↗</a>'

              sections_html = '\n'.join(sections)
              stack_html = ''.join(f'<span>{item}</span>' for item in stack)
              responsibilities_html = bullet_list(responsibilities)

              return clean(f'''
              <!DOCTYPE html>
              <html lang="en">
              <head>
                <meta charset="utf-8" />
                <meta name="viewport" content="width=device-width, initial-scale=1" />
                <title>{title} case study | Harrison Madu</title>
                <meta name="description" content="{summary}" />
                <meta name="theme-color" content="#174d38" />
                <meta property="og:type" content="website" />
                <meta property="og:title" content="{title} case study | Harrison Madu" />
                <meta property="og:description" content="{summary}" />
                <meta property="og:url" content="https://harrisonmadu.github.io/Portfolio/projects/{slug}/" />
                <link rel="canonical" href="https://harrisonmadu.github.io/Portfolio/projects/{slug}/" />
                <link rel="stylesheet" href="../../assets/portfolio.css" />
                <link rel="stylesheet" href="../../assets/case-study.css" />
              </head>
              <body>
                <a class="skip-link" href="#case-main">Skip to case study</a>
                <header class="site-header wrap">
                  <a class="brand" href="{PORTFOLIO}"><span class="monogram" aria-hidden="true">HM</span> Harrison Madu</a>
                  <nav aria-label="Case study navigation">
                    <a href="{PORTFOLIO}#work">Selected work</a>
                    <a href="{PORTFOLIO}#services">Services</a>
                    <a href="{PORTFOLIO}#contact">Contact</a>
                  </nav>
                </header>

                <main class="wrap case-main" id="case-main">
                  <a class="back-link" href="{PORTFOLIO}#more-work">← Back to additional work</a>

                  <section class="case-hero">
                    <div class="case-hero-copy">
                      <span class="eyebrow">{eyebrow}</span>
                      <div class="case-badges"><span>{status}</span><span>{focus}</span></div>
                      <h1>{title}</h1>
                      <p class="case-summary">{summary}</p>
                      <div class="actions">
                        <a class="button" href="mailto:{EMAIL}?subject={title.replace(' ', '%20')}%20project%20enquiry">Discuss a similar build ↗</a>
                        <a class="button secondary" href="{PORTFOLIO}#work">View all work</a>
                      </div>
                    </div>
                    <div class="case-visual" aria-label="Illustrative interface preview">
                      {visual}
                    </div>
                  </section>

                  <section class="case-facts" aria-label="Project facts">
                    <div class="case-fact"><span>ROLE</span><strong>{role}</strong></div>
                    <div class="case-fact"><span>FOCUS</span><strong>{focus}</strong></div>
                    <div class="case-fact"><span>STATUS</span><strong>{status}</strong></div>
                    <div class="case-fact"><span>DELIVERY</span><strong>{timeframe}</strong></div>
                  </section>

                  <div class="case-layout">
                    <article class="case-content">
                      {sections_html}
                    </article>

                    <aside class="case-sidebar" aria-label="Technical summary">
                      <section class="side-card">
                        <span class="side-label">TECHNICAL TOOLKIT</span>
                        <div class="case-tags">{stack_html}</div>
                      </section>
                      <section class="side-card">
                        <span class="side-label">MY RESPONSIBILITIES</span>
                        {responsibilities_html}
                      </section>
                      <section class="side-card scope-card">
                        <span class="side-label">SCOPE NOTE</span>
                        <p>{scope_note}</p>
                        {related}
                      </section>
                    </aside>
                  </div>

                  <section class="case-contact">
                    <div>
                      <span class="eyebrow">Have a similar workflow problem?</span>
                      <h2>Let us turn it into working software.</h2>
                    </div>
                    <div>
                      <p>Share the users, current process, major pain point and the result you need. I will help define a practical first build.</p>
                      <div class="actions">
                        <a class="button" href="mailto:{EMAIL}">Email me ↗</a>
                        <a class="button secondary" href="{LINKEDIN}">LinkedIn ↗</a>
                      </div>
                    </div>
                  </section>
                </main>

                <footer class="site-footer wrap">
                  <p>Harrison Madu · Full-stack development &amp; business systems</p>
                  <div><a href="https://github.com/HarrisonMadu">GitHub</a><a href="{LINKEDIN}">LinkedIn</a><a href="mailto:{EMAIL}">Email</a></div>
                </footer>
              </body>
              </html>
              ''') + '\n'

          visual_ceo = clean('''
            <div class="visual-window visual-window-dark">
              <div class="visual-toolbar"><strong>Executive overview</strong><span>Last 90 days</span></div>
              <div class="visual-metrics">
                <div class="visual-metric"><small>Capital position</small><b>••••••</b><i>Consolidated</i></div>
                <div class="visual-metric"><small>Operating burn</small><b>••••••</b><i>Monthly trend</i></div>
                <div class="visual-metric"><small>Receivables</small><b>••••••</b><i>Action required</i></div>
                <div class="visual-metric"><small>Runway</small><b>•• months</b><i>Scenario view</i></div>
              </div>
              <div class="visual-grid">
                <div class="visual-panel">
                  <div class="visual-panel-head"><strong>Performance trend</strong><span>Revenue · burn</span></div>
                  <div class="visual-chart" aria-hidden="true"><span style="height:34%"></span><span style="height:45%"></span><span style="height:39%"></span><span style="height:58%"></span><span style="height:67%"></span><span style="height:63%"></span><span style="height:82%"></span></div>
                </div>
                <div class="visual-panel visual-list">
                  <div class="visual-panel-head"><strong>Product view</strong><span>Configurable</span></div>
                  <div class="visual-row"><span>Product group A</span><b>Healthy</b></div>
                  <div class="visual-row"><span>Product group B</span><b>Review</b></div>
                  <div class="visual-row"><span>Product group C</span><b>Growing</b></div>
                </div>
              </div>
            </div>
          ''')

          visual_ads = clean('''
            <div class="visual-window">
              <div class="visual-toolbar"><strong>Campaign performance</strong><span>Channel · date · campaign</span></div>
              <div class="visual-metrics compact">
                <div class="visual-metric"><small>Ad spend</small><b>••••••</b><i>Selected range</i></div>
                <div class="visual-metric"><small>Revenue</small><b>••••••</b><i>Attributed</i></div>
                <div class="visual-metric"><small>ROAS</small><b>••.••x</b><i>Blended</i></div>
              </div>
              <div class="visual-grid ads-grid">
                <div class="visual-panel">
                  <div class="visual-panel-head"><strong>Spend vs return</strong><span>Interactive</span></div>
                  <div class="line-chart" aria-hidden="true"><svg viewBox="0 0 400 150" role="img"><polyline points="0,120 55,95 110,105 165,65 220,78 275,35 330,48 400,18" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0,132 55,126 110,116 165,108 220,94 275,87 330,70 400,61" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="6" stroke-linecap="round"/></svg></div>
                </div>
                <div class="visual-panel visual-list">
                  <div class="visual-panel-head"><strong>Campaigns</strong><span>Normalized</span></div>
                  <div class="visual-row"><span>Campaign A</span><b>Efficient</b></div>
                  <div class="visual-row"><span>Campaign B</span><b>Watch</b></div>
                  <div class="visual-row"><span>Campaign C</span><b>Scale</b></div>
                </div>
              </div>
            </div>
          ''')

          visual_buyuse = clean('''
            <div class="visual-window commerce-preview">
              <div class="visual-toolbar"><strong>Buy and Use</strong><span>Mobile-first commerce</span></div>
              <div class="commerce-grid">
                <div class="product-stage">
                  <div class="product-placeholder"><span>PRODUCT</span><b>Clear visual hierarchy</b></div>
                  <div class="thumbnail-row"><i></i><i></i><i></i></div>
                </div>
                <div class="product-details">
                  <small>HOUSEHOLD ESSENTIAL</small>
                  <h3>Product offer built for quick decisions</h3>
                  <p>Benefits, offer structure, delivery information and trust signals appear before the order step.</p>
                  <div class="offer-box"><span>Selected package</span><b>Validated offer</b></div>
                  <div class="form-preview"><span>Customer details</span><span>Delivery location</span><button type="button">Continue to order</button></div>
                </div>
              </div>
            </div>
          ''')

          visual_supremelife = clean('''
            <div class="visual-window commerce-preview wellness-preview">
              <div class="visual-toolbar"><strong>SupremeLife</strong><span>Responsive product journey</span></div>
              <div class="commerce-grid">
                <div class="product-stage wellness-stage">
                  <div class="product-placeholder"><span>PRODUCT STORY</span><b>Structured content and proof</b></div>
                  <div class="content-bars"><i></i><i></i><i></i><i></i></div>
                </div>
                <div class="product-details">
                  <small>CONSUMER WELLNESS</small>
                  <h3>A focused path from product education to order capture</h3>
                  <p>Responsive sections, compliant product information, delivery messaging and a clear order handoff.</p>
                  <div class="trust-row"><span>Clear information</span><span>Delivery guidance</span></div>
                  <div class="form-preview"><span>Contact details</span><span>Order selection</span><button type="button">Submit securely</button></div>
                </div>
              </div>
            </div>
          ''')

          ceo_sections = [
              section('The business problem', '<p>Senior leaders often receive financial and operational information through separate spreadsheets, chat messages and delayed reports. That makes it difficult to understand capital position, operating burn, receivables, runway and product performance from one reliable view.</p>'),
              section('What I built', '<p>I designed and built a configurable executive dashboard that turns high-level business questions into clear reporting modules. Users can show, hide and reorder widgets so the workspace reflects the decisions they make most often.</p>' + bullet_list([
                  'Executive KPI cards for financial and operational signals.',
                  'Trend views for changes over time, not only static totals.',
                  'Product-performance summaries and exception-focused reporting.',
                  'Widget visibility and ordering controls for a personalized owner view.',
                  'Responsive loading, empty, error and restricted-access states.'
              ])),
              section('Full-stack build approach', '<div class="layer-list"><div><strong>Presentation layer</strong><p>Reusable React and TypeScript dashboard components, responsive layouts and accessible interaction states.</p></div><div><strong>Application layer</strong><p>Normalized date, filter and widget state so reporting behaviour stays predictable across the interface.</p></div><div><strong>Data contracts</strong><p>Clear metric definitions and API-ready payload shapes for capital, burn, receivables, runway and product reporting.</p></div><div><strong>Access boundary</strong><p>The module is designed for role-scoped executive access instead of exposing sensitive reporting to every user.</p></div></div>'),
              section('Key engineering decisions', bullet_list([
                  'Keep metric definitions stable so the same number means the same thing everywhere.',
                  'Separate dashboard presentation from raw data sources to make integrations replaceable.',
                  'Use configurable widgets without allowing personalization to alter source-of-truth calculations.',
                  'Prioritize exceptions and decisions instead of filling the screen with every available data point.'
              ])),
              section('Validation and outcome', '<p>Validation focused on responsive behaviour, widget persistence, filter consistency, restricted states and data-format edge cases. The result is a clearer owner-facing product that reduces the time required to assemble a management view and makes important changes easier to identify.</p>')
          ]

          ads_sections = [
              section('The business problem', '<p>Advertising data is often exported from different platforms in inconsistent formats. Teams spend time cleaning spreadsheets before they can answer simple questions about spend, revenue, ROAS, campaign performance and where budget should move next.</p>'),
              section('What I built', '<p>I built an interactive reporting application with Python, Streamlit and Plotly. The app transforms uploaded campaign data into a consistent analysis layer and presents decision-ready views through filters, KPI cards, charts and campaign tables.</p>' + bullet_list([
                  'Campaign and date-range filtering.',
                  'Calculated performance metrics and channel comparisons.',
                  'Interactive trend charts and campaign-level drill-downs.',
                  'Reusable data-cleaning and transformation logic.',
                  'Clear empty, invalid-file and missing-column states.'
              ])),
              section('Application architecture', '<div class="flow-list"><div><span>01</span><strong>Input</strong><p>Campaign exports or prepared datasets enter through a controlled upload path.</p></div><div><span>02</span><strong>Normalize</strong><p>Server-side Python logic standardizes dates, numeric fields and naming differences.</p></div><div><span>03</span><strong>Calculate</strong><p>Reusable functions derive KPIs and grouped performance views.</p></div><div><span>04</span><strong>Present</strong><p>Streamlit and Plotly provide interactive filters, summaries and visual analysis.</p></div></div>'),
              section('Reliability and data quality', bullet_list([
                  'Validate required columns before calculations run.',
                  'Handle blank values, numeric conversion and inconsistent date formats.',
                  'Keep metric calculations in one layer rather than repeating formulas in charts.',
                  'Use anonymized or sample data in public demonstrations.'
              ])),
              section('Outcome', '<p>The build converts a repetitive reporting task into a reusable internal product. Instead of manually rebuilding charts for every report, a user can load the latest data, apply filters and move directly to the campaigns that require action.</p>')
          ]

          buyuse_sections = [
              section('The business problem', '<p>Household-product shoppers often arrive from an advertisement with limited context and little patience. The page must explain the product quickly, make the offer easy to understand, work well on mobile and pass a clean order record into the business workflow.</p>'),
              section('What I built', '<p>This case study focuses on the customer-facing commerce layer for Buy and Use and how it connects to the wider retail operation. I designed and implemented responsive product-page structures, offer presentation, trust and delivery sections, and order-capture journeys.</p>' + bullet_list([
                  'Mobile-first product and offer hierarchy.',
                  'Responsive product imagery and supporting content sections.',
                  'Package or variation selection with clear pricing context.',
                  'Order forms with required-field and contact validation.',
                  'Delivery and payment messaging positioned at decision points.',
                  'Structured handoff from the order journey to operations follow-up.'
              ])),
              section('Full-stack flow', '<div class="flow-list"><div><span>01</span><strong>Discover</strong><p>The visitor lands on a focused product experience from an advertisement or campaign.</p></div><div><span>02</span><strong>Evaluate</strong><p>Benefits, product visuals, offer details and trust information reduce uncertainty.</p></div><div><span>03</span><strong>Validate</strong><p>The interface checks customer, package and delivery inputs before submission.</p></div><div><span>04</span><strong>Handoff</strong><p>A structured order payload moves into the existing commerce and fulfilment workflow.</p></div></div>'),
              section('Frontend and integration work', '<p>The frontend was structured as reusable sections rather than one unmaintainable page. Form states, mobile spacing, visual hierarchy and calls to action were treated as product behaviour. Integration boundaries were designed around the existing commerce platform so the customer experience could improve without pretending every third-party service was custom-built.</p>'),
              section('Quality and delivery', bullet_list([
                  'Responsive checks across common mobile and desktop widths.',
                  'Clear form feedback for incomplete or invalid input.',
                  'Consistent offer information across the page and order step.',
                  'Optimized image placement and content order for faster comprehension.',
                  'No private customer or order data included in the public case study.'
              ])),
              section('Outcome', '<p>The result is a clearer customer journey that supports conversion while producing a more structured order handoff for the team. It demonstrates how frontend product decisions and operational workflow design need to work together.</p>')
          ]

          supreme_sections = [
              section('The business problem', '<p>A consumer wellness product page must educate without overwhelming the visitor, present information responsibly, work smoothly on mobile and capture an order in a form the operations team can actually use.</p>'),
              section('What I built', '<p>I worked on the product experience from content structure through responsive implementation and order-flow integration. The build combines product education, trust, delivery information and a clear conversion path while keeping the public presentation focused and professional.</p>' + bullet_list([
                  'Responsive sales-page structure and content hierarchy.',
                  'Product information, usage guidance and trust sections.',
                  'Clear nationwide delivery and payment messaging.',
                  'Order selection and customer-information capture.',
                  'Validation and feedback around incomplete form states.',
                  'Operational handoff for customer follow-up and fulfilment.'
              ])),
              section('Product engineering flow', '<div class="flow-list"><div><span>01</span><strong>Educate</strong><p>Structured sections explain the product, usage context and important information.</p></div><div><span>02</span><strong>Build confidence</strong><p>Delivery, payment and brand signals appear before the order decision.</p></div><div><span>03</span><strong>Capture</strong><p>The interface collects only the information required to process the order.</p></div><div><span>04</span><strong>Operate</strong><p>The order moves into the existing customer follow-up and fulfilment process.</p></div></div>'),
              section('Frontend, integration and compliance', '<p>The work was delivered within an existing commerce stack. My contribution focused on the product-facing interface, responsive implementation, form behaviour and integration points. Health-related content was treated as a content and compliance concern rather than an excuse to add unsupported technical or medical claims.</p>'),
              section('Quality controls', bullet_list([
                  'Mobile-first review of content order and form usability.',
                  'Consistent product, delivery and payment information.',
                  'Validation for required contact and order fields.',
                  'Clean separation between public content and private order handling.',
                  'No customer data, internal totals or private identifiers in the case study.'
              ])),
              section('Outcome', '<p>The finished experience gives visitors a clearer path from product information to order submission and gives the business a more consistent input for follow-up. The case study shows the product-engineering work behind a conversion page, not only the visual design.</p>')
          ]

          cases = [
              dict(
                  slug='ceo-dashboard', title='CEO Dashboard', eyebrow='EXECUTIVE ANALYTICS · PRODUCT MODULE',
                  summary='A configurable executive workspace for capital, operating burn, receivables, runway and product performance.',
                  status='Development build', role='Product design, frontend and data contracts', focus='Executive reporting', timeframe='Iterative product build',
                  visual=visual_ceo, sections=ceo_sections,
                  stack=['TypeScript', 'React', 'Next.js', 'Dashboard architecture', 'API contracts', 'Responsive UI'],
                  responsibilities=['Translate executive questions into product requirements.', 'Design information hierarchy and reusable widgets.', 'Build responsive dashboard interactions.', 'Define metric and integration contracts.', 'Validate restricted, empty and error states.'],
                  scope_note='Public visuals use masked or representative values. The case study focuses on the product module, reporting architecture and integration boundaries.'
              ),
              dict(
                  slug='ad-performance-dashboard', title='Ad Performance Dashboard', eyebrow='PYTHON · ANALYTICS APPLICATION',
                  summary='An interactive Python reporting application that turns campaign exports into clear performance analysis.',
                  status='Interactive build', role='Data app design and development', focus='Advertising analytics', timeframe='Reusable reporting workflow',
                  visual=visual_ads, sections=ads_sections,
                  stack=['Python', 'Streamlit', 'Plotly', 'Data transformation', 'Interactive reporting', 'Validation'],
                  responsibilities=['Design the reporting workflow.', 'Normalize campaign data.', 'Implement KPI calculations.', 'Build interactive charts and filters.', 'Handle invalid and incomplete input.'],
                  scope_note='The public case study uses sample or anonymized campaign data. It describes a Python data application rather than claiming a TypeScript backend.'
              ),
              dict(
                  slug='buy-and-use', title='Buy and Use Commerce Experience', eyebrow='ECOMMERCE · CUSTOMER EXPERIENCE',
                  summary='A mobile-first product and order journey connected to the operational needs of a household-products business.',
                  status='Production-facing work', role='Product UX, frontend and order-flow integration', focus='Commerce experience', timeframe='Ongoing product iteration',
                  visual=visual_buyuse, sections=buyuse_sections,
                  stack=['Responsive web UI', 'HTML/CSS', 'JavaScript', 'WordPress/Elementor', 'Form integration', 'Commerce workflows'],
                  responsibilities=['Structure the product journey.', 'Implement responsive page sections.', 'Design offer and order states.', 'Connect forms to existing workflows.', 'Improve clarity through iterative testing.'],
                  scope_note='The implementation works with the existing commerce and fulfilment stack. Third-party platform services are not presented as code I authored.',
                  related_href='/Portfolio/#buy-and-use', related_label='View the related retail operations system'
              ),
              dict(
                  slug='supremelife', title='SupremeLife Commerce Experience', eyebrow='ECOMMERCE · RESPONSIVE PRODUCT BUILD',
                  summary='A structured wellness-product experience that connects clear information, responsive design and order capture.',
                  status='Production-facing work', role='Product UX, frontend and integration', focus='Commerce product page', timeframe='Campaign-led iteration',
                  visual=visual_supremelife, sections=supreme_sections,
                  stack=['Responsive web UI', 'HTML/CSS', 'JavaScript', 'WordPress/Elementor', 'Form integration', 'Content systems'],
                  responsibilities=['Plan the page and content flow.', 'Build responsive sections.', 'Implement order-form behaviour.', 'Connect the customer journey to follow-up.', 'Review clarity, privacy and content risk.'],
                  scope_note='This case study focuses on product engineering and the customer journey. It does not claim ownership of unrelated third-party payment, hosting or fulfilment services.'
              ),
          ]

          for case in cases:
              folder = PROJECTS / case['slug']
              folder.mkdir(parents=True, exist_ok=True)
              (folder / 'index.html').write_text(render_page(**case), encoding='utf-8')

          case_css = clean('''
          .case-main { padding-top: 44px; }
          .back-link { display: inline-flex; margin-bottom: 26px; color: var(--muted); text-decoration: none; font-size: .86rem; }
          .back-link:hover { color: var(--green); }
          .case-hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(420px, .9fr); gap: 54px; align-items: center; padding: 24px 0 58px; }
          .case-hero h1 { margin-top: 15px; font-size: clamp(3rem, 6vw, 5.2rem); max-width: 760px; }
          .case-summary { margin-top: 22px; max-width: 720px; color: var(--muted); font-size: 1.08rem; }
          .case-badges { display: flex; flex-wrap: wrap; gap: 8px; }
          .case-badges span { padding: 5px 9px; border: 1px solid #cfd8ca; border-radius: 4px; color: var(--green); background: #edf2e8; font-size: .69rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
          .case-visual { min-width: 0; padding: 16px; border: 1px solid #cfd8ca; border-radius: 16px; background: #e8eee3; box-shadow: 0 24px 70px rgba(23, 77, 56, .12); }
          .visual-window { min-height: 430px; overflow: hidden; border: 1px solid #d7ddd2; border-radius: 10px; background: #fffefa; color: #172820; }
          .visual-window-dark { background: #102f24; border-color: #274a3d; color: #f6f4ee; }
          .visual-toolbar { min-height: 55px; padding: 16px 18px; display: flex; justify-content: space-between; gap: 20px; align-items: center; border-bottom: 1px solid rgba(110, 132, 118, .22); font-size: .76rem; }
          .visual-toolbar span { color: #718078; }
          .visual-window-dark .visual-toolbar span { color: #b7c4bb; }
          .visual-metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 14px; }
          .visual-metrics.compact { grid-template-columns: repeat(3, 1fr); }
          .visual-metric { min-width: 0; padding: 13px; border: 1px solid rgba(115, 136, 120, .18); border-radius: 7px; background: rgba(255,255,255,.72); }
          .visual-window-dark .visual-metric { background: rgba(255,255,255,.055); border-color: rgba(255,255,255,.11); }
          .visual-metric small, .visual-metric i { display: block; color: #708078; font-size: .63rem; font-style: normal; }
          .visual-window-dark .visual-metric small, .visual-window-dark .visual-metric i { color: #b4c3ba; }
          .visual-metric b { display: block; margin: 7px 0 4px; font-size: 1rem; }
          .visual-grid { display: grid; grid-template-columns: 1.4fr .8fr; gap: 12px; padding: 0 14px 14px; }
          .visual-panel { min-width: 0; min-height: 220px; padding: 14px; border: 1px solid rgba(115, 136, 120, .18); border-radius: 7px; background: rgba(255,255,255,.7); }
          .visual-window-dark .visual-panel { background: rgba(255,255,255,.045); border-color: rgba(255,255,255,.11); }
          .visual-panel-head { display: flex; justify-content: space-between; gap: 12px; font-size: .7rem; }
          .visual-panel-head span { color: #718078; }
          .visual-chart { height: 150px; display: flex; align-items: end; gap: 8px; margin-top: 23px; padding: 0 4px; border-bottom: 1px solid rgba(115, 136, 120, .2); }
          .visual-chart span { flex: 1; border-radius: 3px 3px 0 0; background: #5f9c75; }
          .line-chart { margin-top: 24px; padding: 5px 4px; color: #177b50; }
          .line-chart svg { width: 100%; height: 150px; overflow: visible; }
          .visual-list { display: flex; flex-direction: column; }
          .visual-row { display: flex; justify-content: space-between; gap: 10px; padding: 15px 0; border-bottom: 1px solid rgba(115, 136, 120, .16); font-size: .68rem; }
          .visual-row b { color: #31724f; }
          .visual-window-dark .visual-row b { color: #a8d6b7; }
          .commerce-preview { min-height: 430px; }
          .commerce-grid { display: grid; grid-template-columns: .9fr 1.1fr; min-height: 374px; }
          .product-stage { padding: 22px; background: #e4eee1; border-right: 1px solid #d5ddd1; }
          .product-placeholder { height: 245px; display: flex; flex-direction: column; justify-content: end; padding: 22px; border-radius: 9px; background: linear-gradient(145deg, #174d38, #4f8463); color: white; }
          .product-placeholder span { font-size: .62rem; letter-spacing: .14em; }
          .product-placeholder b { margin-top: 8px; font: 1.35rem/1.15 Georgia, serif; }
          .thumbnail-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
          .thumbnail-row i { height: 45px; border: 1px solid #c7d4c4; border-radius: 5px; background: #f7f7ef; }
          .product-details { padding: 30px 26px; }
          .product-details > small { color: var(--green); font-size: .62rem; font-weight: 700; letter-spacing: .13em; }
          .product-details h3 { margin-top: 11px; font-size: 1.6rem; }
          .product-details p { margin-top: 13px; color: var(--muted); font-size: .76rem; }
          .offer-box { display: flex; justify-content: space-between; gap: 15px; margin-top: 20px; padding: 12px; border: 1px solid #d7ddd2; border-radius: 6px; font-size: .68rem; }
          .form-preview { display: grid; gap: 8px; margin-top: 15px; }
          .form-preview span { padding: 10px; border: 1px solid #d7ddd2; border-radius: 5px; color: #768178; font-size: .65rem; }
          .form-preview button { padding: 11px; border: 0; border-radius: 5px; background: var(--green); color: white; font: inherit; font-size: .7rem; font-weight: 700; }
          .wellness-stage { background: #efe8df; }
          .wellness-stage .product-placeholder { background: linear-gradient(145deg, #5b2f2f, #a56d55); }
          .content-bars { display: grid; gap: 7px; margin-top: 12px; }
          .content-bars i { display: block; height: 7px; border-radius: 99px; background: #cfc4b8; }
          .content-bars i:nth-child(2) { width: 84%; }
          .content-bars i:nth-child(3) { width: 92%; }
          .content-bars i:nth-child(4) { width: 65%; }
          .trust-row { display: flex; gap: 7px; margin-top: 18px; }
          .trust-row span { flex: 1; padding: 8px; border-radius: 4px; background: #f2eee7; color: #765747; font-size: .6rem; text-align: center; }
          .case-facts { display: grid; grid-template-columns: repeat(4, 1fr); border-block: 1px solid var(--line); }
          .case-fact { padding: 22px 22px 22px 0; }
          .case-fact + .case-fact { padding-left: 22px; border-left: 1px solid var(--line); }
          .case-fact span, .side-label { display: block; color: var(--muted); font-size: .63rem; font-weight: 700; letter-spacing: .12em; }
          .case-fact strong { display: block; margin-top: 6px; font-size: .86rem; }
          .case-layout { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(285px, .7fr); gap: 70px; padding-top: 72px; align-items: start; }
          .case-content { min-width: 0; }
          .case-section { padding: 0 0 52px; border-bottom: 1px solid var(--line); margin-bottom: 48px; }
          .case-section:last-child { margin-bottom: 0; }
          .case-section h2 { font-size: clamp(1.8rem, 3vw, 2.5rem); }
          .case-section p { margin-top: 18px; color: var(--muted); max-width: 800px; }
          .case-section ul { margin: 22px 0 0; padding-left: 21px; }
          .case-section li { margin: 9px 0; }
          .layer-list, .flow-list { display: grid; gap: 12px; margin-top: 24px; }
          .layer-list > div, .flow-list > div { padding: 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--white); }
          .layer-list p, .flow-list p { margin-top: 7px; font-size: .86rem; }
          .flow-list { grid-template-columns: repeat(2, 1fr); }
          .flow-list span { display: inline-grid; place-items: center; width: 28px; height: 28px; margin-right: 10px; border: 1px solid #b7c9b4; border-radius: 50%; color: var(--green); font-size: .65rem; }
          .case-sidebar { display: grid; gap: 17px; position: sticky; top: 24px; }
          .side-card { padding: 22px; border: 1px solid var(--line); border-radius: 10px; background: var(--white); }
          .side-card ul { margin: 17px 0 0; padding-left: 18px; font-size: .8rem; }
          .side-card li { margin: 8px 0; }
          .side-card p { margin-top: 14px; color: var(--muted); font-size: .82rem; }
          .case-tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 17px; }
          .case-tags span { padding: 5px 8px; border: 1px solid #dce1d7; border-radius: 4px; color: var(--muted); font-size: .67rem; }
          .text-link { display: inline-block; margin-top: 15px; font-size: .78rem; }
          .scope-card { border-left: 3px solid #b99549; }
          .case-contact { margin: 82px 0 38px; padding: 38px; display: grid; grid-template-columns: 1fr 1fr; gap: 50px; border-radius: 12px; background: var(--green); color: white; }
          .case-contact .eyebrow { color: #bed1bd; margin-bottom: 10px; }
          .case-contact h2 { font-size: clamp(2rem, 3.4vw, 2.8rem); }
          .case-contact p { color: #d8e4d5; }
          .case-contact .actions { margin-top: 22px; }
          .case-contact .button { background: #f6f4ee; color: var(--green); border-color: #f6f4ee; }
          .case-contact .button.secondary { background: transparent; color: white; border-color: #85a38c; }
          @media (max-width: 980px) {
            .case-hero { grid-template-columns: 1fr; }
            .case-layout { grid-template-columns: 1fr; gap: 38px; }
            .case-sidebar { position: static; grid-template-columns: repeat(2, 1fr); }
            .scope-card { grid-column: 1 / -1; }
          }
          @media (max-width: 720px) {
            .case-hero { padding-bottom: 42px; }
            .case-visual { padding: 9px; }
            .visual-window { min-height: 0; }
            .visual-metrics { grid-template-columns: repeat(2, 1fr); }
            .visual-grid, .commerce-grid { grid-template-columns: 1fr; }
            .product-stage { border-right: 0; border-bottom: 1px solid #d5ddd1; }
            .case-facts { grid-template-columns: repeat(2, 1fr); }
            .case-fact:nth-child(3) { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); }
            .case-fact:nth-child(4) { border-top: 1px solid var(--line); }
            .case-sidebar { grid-template-columns: 1fr; }
            .scope-card { grid-column: auto; }
            .flow-list { grid-template-columns: 1fr; }
            .case-contact { grid-template-columns: 1fr; gap: 22px; padding: 28px; }
          }
          ''') + '\n'
          (DOCS / 'assets' / 'case-study.css').write_text(case_css, encoding='utf-8')

          more_work_section = clean('''
          <section class="more-work-section" id="more-work" aria-labelledby="more-work-title">
            <div class="section-head more-work-head">
              <div><span class="eyebrow">More product and engineering work</span><h2 id="more-work-title">Open the full case study.</h2></div>
              <p>Detailed project pages showing how I approach product discovery, interfaces, data flows, integrations, reliability and delivery.</p>
            </div>
            <div class="more-work-grid">
              <a class="more-work-card" href="/Portfolio/projects/ceo-dashboard/">
                <span class="more-work-number">01</span><span class="more-work-type">Executive analytics</span>
                <h3>CEO Dashboard</h3><p>Configurable reporting for capital, burn, receivables, runway and product performance.</p>
                <span class="more-work-link">Open case study ↗</span>
              </a>
              <a class="more-work-card" href="/Portfolio/projects/ad-performance-dashboard/">
                <span class="more-work-number">02</span><span class="more-work-type">Python data application</span>
                <h3>Ad Performance Dashboard</h3><p>An interactive reporting build that turns campaign exports into decision-ready analysis.</p>
                <span class="more-work-link">Open case study ↗</span>
              </a>
              <a class="more-work-card" href="/Portfolio/projects/buy-and-use/">
                <span class="more-work-number">03</span><span class="more-work-type">Commerce product experience</span>
                <h3>Buy and Use</h3><p>A mobile-first product journey connected to order capture and retail operations.</p>
                <span class="more-work-link">Open case study ↗</span>
              </a>
              <a class="more-work-card" href="/Portfolio/projects/supremelife/">
                <span class="more-work-number">04</span><span class="more-work-type">Responsive product build</span>
                <h3>SupremeLife</h3><p>A structured product experience linking responsible information, order capture and fulfilment handoff.</p>
                <span class="more-work-link">Open case study ↗</span>
              </a>
            </div>
          </section>
          ''')

          for filename in ('index.html', 'docs/index.html'):
              path = ROOT / filename
              text = path.read_text(encoding='utf-8')
              old_paragraph = re.compile(r'\s*<p class="other-work">.*?</p>', re.S)
              existing_section = re.compile(r'\s*<section class="more-work-section".*?</section>', re.S)
              if old_paragraph.search(text):
                  text = old_paragraph.sub('\n' + more_work_section, text, count=1)
              elif existing_section.search(text):
                  text = existing_section.sub('\n' + more_work_section, text, count=1)
              else:
                  raise RuntimeError(f'Could not locate the More work block in {filename}')
              path.write_text(text, encoding='utf-8')

          card_css = clean('''
          /* CASE-STUDY-CARDS:START */
          .more-work-section { margin-top: 58px; padding-top: 68px; border-top: 1px solid var(--line); }
          .more-work-head { margin-bottom: 30px; }
          .more-work-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
          .more-work-card { min-width: 0; min-height: 280px; padding: 25px; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; background: var(--white); color: var(--ink); text-decoration: none; transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
          .more-work-card:hover { transform: translateY(-3px); border-color: #9fb59d; box-shadow: 0 18px 45px rgba(23,77,56,.09); }
          .more-work-number { color: #8b978e; font-size: .66rem; }
          .more-work-type { margin-top: 28px; color: var(--green); font-size: .63rem; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; }
          .more-work-card h3 { margin-top: 12px; font-size: 1.75rem; }
          .more-work-card p { margin-top: 13px; color: var(--muted); font-size: .88rem; max-width: 480px; }
          .more-work-link { margin-top: auto; padding-top: 28px; color: var(--green); font-size: .78rem; font-weight: 700; }
          @media (max-width: 720px) { .more-work-grid { grid-template-columns: 1fr; } .more-work-card { min-height: 245px; } }
          /* CASE-STUDY-CARDS:END */
          ''')
          css_path = DOCS / 'assets' / 'portfolio.css'
          css = css_path.read_text(encoding='utf-8')
          css_pattern = re.compile(r'/\* CASE-STUDY-CARDS:START \*/.*?/\* CASE-STUDY-CARDS:END \*/', re.S)
          if css_pattern.search(css):
              css = css_pattern.sub(card_css, css, count=1)
          else:
              css = css.rstrip() + '\n\n' + card_css + '\n'
          css_path.write_text(css, encoding='utf-8')

          readme_path = ROOT / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          readme_pattern = re.compile(r'### More work\n.*?\n## How we can work together', re.S)
          readme_more = clean('''
          ### More full-stack and product case studies

          - **[CEO Dashboard](https://harrisonmadu.github.io/Portfolio/projects/ceo-dashboard/)** — configurable executive reporting for capital, burn, receivables, runway, and product performance.
          - **[Ad Performance Dashboard](https://harrisonmadu.github.io/Portfolio/projects/ad-performance-dashboard/)** — interactive Python, Streamlit, and Plotly reporting application.
          - **[Buy and Use Commerce Experience](https://harrisonmadu.github.io/Portfolio/projects/buy-and-use/)** — responsive product journey, order capture, and commerce-workflow integration.
          - **[SupremeLife Commerce Experience](https://harrisonmadu.github.io/Portfolio/projects/supremelife/)** — responsive product page, form behaviour, and customer-to-operations handoff.

          ## How we can work together
          ''')
          if not readme_pattern.search(readme):
              raise RuntimeError('Could not locate README More work section')
          readme = readme_pattern.sub(readme_more.rstrip(), readme, count=1)
          readme_path.write_text(readme, encoding='utf-8')

          for required in [
              PROJECTS / 'ceo-dashboard' / 'index.html',
              PROJECTS / 'ad-performance-dashboard' / 'index.html',
              PROJECTS / 'buy-and-use' / 'index.html',
              PROJECTS / 'supremelife' / 'index.html',
              DOCS / 'assets' / 'case-study.css'
          ]:
              if not required.is_file() or required.stat().st_size < 500:
                  raise RuntimeError(f'Missing or incomplete generated file: {required}')
          PY

      - name: Commit case-study experience
        shell: bash
        run: |
          rm -f .github/workflows/build-full-stack-case-studies.yml
          rm -f .github/workflows/build-portfolio-case-studies.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add internal full-stack project case studies"
          git push origin HEAD:main
