name: Update portfolio project images

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-portfolio-images.yml

permissions:
  contents: write

jobs:
  update-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tools
        run: |
          python -m pip install --disable-pip-version-check pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core

      - name: Rebrand portfolio screenshots
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          ROOT = Path('.')
          ASSETS = ROOT / 'docs' / 'assets' / 'projects'
          FONT_REG = '/usr/share/fonts/truetype/dejavu/DejaVuSansCondensed.ttf'
          FONT_BOLD = '/usr/share/fonts/truetype/dejavu/DejaVuSansCondensed-Bold.ttf'

          def pf(path, size):
              return ImageFont.truetype(path, size)

          def fitf(draw, text, maxw, maxsize, minsize=8, path=FONT_BOLD):
              for size in range(maxsize, minsize - 1, -1):
                  f = pf(path, size)
                  box = draw.textbbox((0, 0), text, font=f)
                  if box[2] - box[0] <= maxw:
                      return f
              return pf(path, minsize)

          def center(draw, box, text, font, fill):
              x1, y1, x2, y2 = box
              bounds = draw.textbbox((0, 0), text, font=font)
              width = bounds[2] - bounds[0]
              height = bounds[3] - bounds[1]
              x = x1 + (x2 - x1 - width) / 2
              y = y1 + (y2 - y1 - height) / 2 - bounds[1]
              draw.text((x, y), text, font=font, fill=fill)

          def leftmid(draw, box, text, font, fill, pad=0):
              x1, y1, x2, y2 = box
              bounds = draw.textbbox((0, 0), text, font=font)
              height = bounds[3] - bounds[1]
              y = y1 + (y2 - y1 - height) / 2 - bounds[1]
              draw.text((x1 + pad, y), text, font=font, fill=fill)

          def build_school():
              source = ASSETS / 'school-management-executive.png'
              target = ASSETS / 'rock-foundation-college-dashboard.png'
              original = Image.open(source).convert('RGB')
              img = original.copy()
              draw = ImageDraw.Draw(img)

              header = (254, 253, 248)
              badge = (252, 249, 240)
              card = (254, 253, 250)
              row = (254, 253, 250)
              side = (14, 66, 41)
              brand = (5, 77, 49)
              ink = (3, 52, 33)
              text = (20, 31, 28)
              muted = (72, 72, 69)
              white = (247, 247, 239)

              draw.rounded_rectangle((18, 130, 244, 198), radius=10, fill=brand)
              center(draw, (25, 136, 237, 164), 'ROCK FOUNDATION', pf(FONT_BOLD, 18), white)
              center(draw, (25, 161, 237, 194), 'COLLEGE', pf(FONT_BOLD, 25), white)

              draw.rectangle((280, 18, 905, 89), fill=header)
              title = 'Rock Foundation College — Executive'
              draw.text((289, 31), title, font=fitf(draw, title, 600, 35, 24), fill=ink)
              draw.rectangle((284, 173, 720, 213), fill=header)
              draw.text((290, 181), 'Overview of school operations.', font=pf(FONT_REG, 18), fill=text)

              draw.rectangle((1092, 24, 1234, 82), fill=header)
              leftmid(draw, (1100, 28, 1234, 78), 'Main campus', pf(FONT_REG, 18), text)
              draw.rectangle((1327, 20, 1463, 86), fill=header)
              draw.text((1336, 29), 'School admin', font=pf(FONT_BOLD, 17), fill=text)
              draw.text((1336, 56), 'Administrator', font=pf(FONT_REG, 14), fill=text)

              # Preserve the original calendar icon, then replace all concept wording.
              img.paste(original.crop((1168, 140, 1212, 190)), (1168, 140))
              draw = ImageDraw.Draw(img)
              draw.rectangle((1212, 145, 1490, 188), fill=badge)
              center(draw, (1218, 145, 1490, 188), 'Development build', pf(FONT_REG, 17), text)

              for box in ((385, 344, 507, 384), (684, 344, 810, 384), (988, 344, 1118, 384), (1283, 344, 1410, 384)):
                  draw.rectangle(box, fill=card)
                  center(draw, box, 'Anonymized data', pf(FONT_REG, 13), muted)

              date_boxes = ((780, 552, 866, 607), (780, 629, 866, 684), (780, 705, 866, 760), (780, 782, 866, 837), (780, 858, 866, 913))
              for box, date in zip(date_boxes, ('05 Sep', '07 Sep', '09 Sep', '11 Sep', '13 Sep')):
                  draw.rectangle(box, fill=row)
                  center(draw, box, date, pf(FONT_REG, 13), text)

              draw.rectangle((18, 889, 195, 964), fill=side)
              draw.text((24, 897), 'Current term', font=pf(FONT_BOLD, 14), fill=white)
              draw.text((24, 925), '2026/2027 session', font=pf(FONT_REG, 12), fill=white)

              img.save(target, optimize=True)
              source.unlink()

          def build_retail():
              source = ASSETS / 'retailos-executive.png'
              target = ASSETS / 'buy-and-use-dashboard.png'
              img = Image.open(source).convert('RGB')
              draw = ImageDraw.Draw(img)

              header = (252, 252, 247)
              card = (249, 249, 238)
              bottom = (245, 248, 237)
              headcard = (253, 252, 247)
              row1 = (252, 252, 247)
              row2 = (252, 252, 247)
              row3 = (253, 252, 247)
              brand = (4, 76, 49)
              ink = (3, 52, 33)
              text = (20, 31, 28)
              muted = (72, 72, 69)
              white = (247, 247, 239)
              green = (0, 132, 72)

              draw.rounded_rectangle((73, 20, 245, 94), radius=9, fill=brand)
              draw.text((85, 28), 'BUY AND USE', font=pf(FONT_BOLD, 24), fill=white)
              draw.text((86, 63), 'RETAIL OPERATIONS', font=pf(FONT_BOLD, 12), fill=white)

              draw.rectangle((279, 18, 875, 88), fill=header)
              title = 'Buy and Use — Executive overview'
              draw.text((288, 29), title, font=fitf(draw, title, 560, 35, 24), fill=ink)

              draw.rectangle((936, 22, 1214, 90), fill=header)
              draw.text((943, 34), 'Development build', font=pf(FONT_BOLD, 15), fill=text)
              draw.text((943, 59), 'Anonymized data', font=pf(FONT_REG, 12), fill=muted)

              draw.rectangle((1353, 19, 1496, 91), fill=header)
              draw.text((1362, 28), 'Operations admin', font=pf(FONT_BOLD, 17), fill=text)
              draw.text((1362, 55), 'Head Office', font=pf(FONT_REG, 14), fill=text)

              for box in ((376, 235, 501, 279), (989, 235, 1118, 279)):
                  draw.rectangle(box, fill=card)
                  center(draw, box, 'Anonymized data', pf(FONT_REG, 13), muted)

              for box in ((370, 938, 495, 969), (976, 938, 1101, 969)):
                  draw.rectangle(box, fill=bottom)
                  center(draw, box, 'Anonymized data', pf(FONT_REG, 13), muted)

              draw.rectangle((548, 326, 670, 371), fill=headcard)
              draw.ellipse((556, 342, 568, 354), fill=green)
              draw.text((578, 335), 'All branches', font=pf(FONT_REG, 13), fill=text)

              draw.rectangle((1198, 326, 1490, 371), fill=headcard)
              draw.ellipse((1205, 342, 1217, 354), fill=green)
              draw.text((1226, 335), 'Live view', font=pf(FONT_REG, 13), fill=text)
              draw.text((1318, 335), 'Recent transactions', font=pf(FONT_REG, 12), fill=muted)

              for box, bg in (((320, 489, 420, 514), row1), ((320, 571, 420, 596), row2), ((320, 653, 420, 678), row3)):
                  draw.rectangle(box, fill=bg)
                  leftmid(draw, box, 'Retail branch', pf(FONT_REG, 12), muted, pad=7)

              for box, bg in (((530, 475, 626, 501), row1), ((530, 557, 626, 583), row2), ((530, 639, 626, 665), row3)):
                  draw.rectangle(box, fill=bg)
                  center(draw, box, 'Anonymized', pf(FONT_REG, 11), muted)

              img.save(target, optimize=True)
              source.unlink()

          build_school()
          build_retail()

          replacements = {
              'school-management-executive.png': 'rock-foundation-college-dashboard.png',
              'retailos-executive.png': 'buy-and-use-dashboard.png',
          }
          for filename in ('README.md', 'index.html', 'docs/index.html'):
              path = ROOT / filename
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit branded screenshots
        shell: bash
        run: |
          rm -f .github/workflows/export-portfolio-images.yml
          rm -f .github/workflows/update-portfolio-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Replace portfolio mockups with branded development screenshots"
          git push origin HEAD:main
