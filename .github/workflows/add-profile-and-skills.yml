name: Add profile and skills to portfolio

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-profile-and-skills.yml

permissions:
  contents: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Harrison profile, experience and technical stack
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import re
          import textwrap

          ROOT = Path('.')
          DOCS = ROOT / 'docs'
          ASSETS = DOCS / 'assets'
          ASSETS.mkdir(parents=True, exist_ok=True)

          PHOTO_B64 = """"""

          photo = base64.b64decode(PHOTO_B64)
          if len(photo) < 5000 or photo[:4] != b'RIFF' or photo[8:12] != b'WEBP':
              raise RuntimeError('Profile image data is invalid')
          (ASSETS / 'harrison-madu-profile.webp').write_bytes(photo)

          def dedent(value):
              return textwrap.dedent(value).strip()

          def profile_section(photo_src):
              return dedent(f'''
              <!-- PROFILE-AND-SKILLS:START -->
              <section class="section profile-section" id="about" aria-labelledby="about-title">
                <div class="profile-grid">
                  <figure class="profile-photo-card">
                    <div class="profile-photo-wrap">
                      <img src="{photo_src}" width="360" height="360" alt="Harrison Madu, full-stack engineer" loading="eager" decoding="async" />
                      <div class="experience-chip" aria-label="Six years of professional experience"><strong>6</strong><span>years of<br />experience</span></div>
                    </div>
                    <figcaption><strong>Harrison Madu</strong><span>Full-stack engineer · Lagos, Nigeria</span></figcaption>
                  </figure>

                  <div class="profile-copy">
                    <span class="eyebrow">About the engineer</span>
                    <h2 id="about-title">Six years building software around real business workflows.</h2>
                    <p>I am a full-stack engineer who designs and builds custom CRM, ERP, inventory, reporting, and business operations systems.</p>
                    <p>My work covers product discovery, UI/UX implementation, responsive frontend development, backend APIs, PostgreSQL data modelling, authentication, permissions, testing, deployment, and post-launch improvement.</p>
                    <p>I am strongest when a business process is difficult to track, spread across disconnected tools, or dependent on manual follow-up. I turn that process into secure software a team can use every day.</p>
                    <div class="profile-highlights" aria-label="Professional strengths">
                      <div><strong>End-to-end ownership</strong><span>From requirements and interface design to APIs, databases, testing, and delivery.</span></div>
                      <div><strong>Business-first engineering</strong><span>Systems are shaped around the real workflow, users, controls, and reporting needs.</span></div>
                      <div><strong>Remote collaboration</strong><span>Clear written updates, practical trade-offs, and dependable handover documentation.</span></div>
                    </div>
                  </div>
                </div>

                <div class="skills-block" id="skills" aria-labelledby="skills-title">
                  <div class="section-head skills-head">
                    <div><span class="eyebrow">Skills and technologies</span><h3 id="skills-title">The tools I use to take a product from idea to production.</h3></div>
                    <p>Grouped by the part of the product I am responsible for, not as an unfiltered list of buzzwords.</p>
                  </div>
                  <div class="skills-grid">
                    <article class="skill-group">
                      <span class="skill-number">01</span><h4>Frontend</h4>
                      <p>Responsive interfaces and product experiences that remain clear across desktop and mobile.</p>
                      <div class="skill-pills"><span>React</span><span>Next.js</span><span>TypeScript</span><span>JavaScript</span><span>HTML5</span><span>CSS3</span><span>Tailwind CSS</span><span>Responsive UI</span><span>UI/UX implementation</span></div>
                    </article>
                    <article class="skill-group">
                      <span class="skill-number">02</span><h4>Backend and APIs</h4>
                      <p>Application services, business rules, access boundaries, integrations, and reliable error handling.</p>
                      <div class="skill-pills"><span>Node.js</span><span>NestJS</span><span>REST APIs</span><span>Authentication</span><span>RBAC</span><span>API integration</span><span>Server-side validation</span></div>
                    </article>
                    <article class="skill-group">
                      <span class="skill-number">03</span><h4>Database and data</h4>
                      <p>Structured data models, operational reporting, and practical analysis for business decisions.</p>
                      <div class="skill-pills"><span>PostgreSQL</span><span>Prisma ORM</span><span>SQL</span><span>Database design</span><span>Data modelling</span><span>Python</span><span>Streamlit</span><span>Plotly</span><span>Power BI</span></div>
                    </article>
                    <article class="skill-group">
                      <span class="skill-number">04</span><h4>Tools and delivery</h4>
                      <p>Planning, collaboration, testing, version control, interface design, and controlled releases.</p>
                      <div class="skill-pills"><span>Git</span><span>GitHub</span><span>Visual Studio Code</span><span>Postman</span><span>Figma</span><span>CI/CD workflows</span><span>GitHub Actions</span><span>Deployment support</span></div>
                    </article>
                  </div>
                </div>
              </section>
              <!-- PROFILE-AND-SKILLS:END -->
              ''')

          nav = dedent('''
          <nav aria-label="Main navigation">
            <a href="#about">About</a><a href="#work">Selected work</a><a href="#skills">Skills</a><a href="#services">Services</a><a href="#contact">Let's talk ↗</a>
          </nav>
          ''')

          for filename, photo_src in (
              ('index.html', 'docs/assets/harrison-madu-profile.webp'),
              ('docs/index.html', 'assets/harrison-madu-profile.webp'),
          ):
              path = ROOT / filename
              text = path.read_text(encoding='utf-8')

              text = re.sub(r'<title>.*?</title>', '<title>Harrison Madu | Full-Stack Engineer &amp; Business Systems Developer</title>', text, count=1, flags=re.S)
              text = re.sub(
                  r'<meta name="description" content=".*?"\s*/>',
                  '<meta name="description" content="Harrison Madu is a full-stack engineer with 6 years of experience building custom CRM, ERP, inventory, reporting, and business operations systems." />',
                  text,
                  count=1,
                  flags=re.S,
              )
              text = re.sub(
                  r'<meta property="og:title" content=".*?"\s*/>',
                  '<meta property="og:title" content="Harrison Madu | Full-Stack Engineer" />',
                  text,
                  count=1,
                  flags=re.S,
              )
              text = re.sub(
                  r'<meta property="og:description" content=".*?"\s*/>',
                  '<meta property="og:description" content="Six years building CRM, ERP, inventory, reporting, and business operations software from interface to deployment." />',
                  text,
                  count=1,
                  flags=re.S,
              )
              text = re.sub(r'<nav aria-label="Main navigation">.*?</nav>', nav, text, count=1, flags=re.S)
              text = text.replace('Full-stack developer · Lagos, Nigeria', 'Full-stack engineer · 6 years experience · Lagos, Nigeria')

              block = profile_section(photo_src)
              marker_pattern = re.compile(r'\s*<!-- PROFILE-AND-SKILLS:START -->.*?<!-- PROFILE-AND-SKILLS:END -->', re.S)
              if marker_pattern.search(text):
                  text = marker_pattern.sub('\n' + block, text, count=1)
              else:
                  capabilities = re.compile(r'(<div class="capabilities"[^>]*>.*?</div>)', re.S)
                  if not capabilities.search(text):
                      raise RuntimeError(f'Could not locate capabilities block in {filename}')
                  text = capabilities.sub(r'\1\n\n' + block, text, count=1)

              text = text.replace('AI-assisted development tools', '')
              path.write_text(text, encoding='utf-8')

          css_path = DOCS / 'assets' / 'portfolio.css'
          css = css_path.read_text(encoding='utf-8')
          profile_css = dedent('''
          /* PROFILE-AND-SKILLS:START */
          .profile-section { padding-top: 78px; }
          .profile-grid { display: grid; grid-template-columns: minmax(280px, .72fr) minmax(0, 1.28fr); gap: clamp(40px, 7vw, 92px); align-items: center; }
          .profile-photo-card { margin: 0; }
          .profile-photo-wrap { position: relative; max-width: 440px; padding: 13px; border: 1px solid var(--line); border-radius: 20px; background: var(--white); box-shadow: 0 24px 65px rgba(23, 77, 56, .12); }
          .profile-photo-wrap::before { content: ''; position: absolute; inset: 26px -18px -18px 26px; z-index: -1; border-radius: 20px; background: #dce7d7; }
          .profile-photo-wrap img { display: block; width: 100%; height: auto; aspect-ratio: 1; object-fit: cover; border-radius: 13px; }
          .profile-photo-card figcaption { display: flex; flex-direction: column; gap: 4px; padding-top: 21px; }
          .profile-photo-card figcaption strong { font-size: 1.05rem; }
          .profile-photo-card figcaption span { color: var(--muted); font-size: .79rem; }
          .experience-chip { position: absolute; right: -20px; bottom: 24px; min-width: 132px; padding: 13px 16px; display: flex; align-items: center; gap: 10px; border: 1px solid #6e947c; border-radius: 10px; background: var(--green); color: white; box-shadow: 0 14px 35px rgba(20, 57, 43, .24); }
          .experience-chip strong { font: 2.3rem/1 Georgia, serif; }
          .experience-chip span { font-size: .66rem; font-weight: 700; line-height: 1.2; letter-spacing: .06em; text-transform: uppercase; }
          .profile-copy h2 { margin-top: 13px; max-width: 780px; font-size: clamp(2.35rem, 4.6vw, 4.25rem); }
          .profile-copy > p { max-width: 790px; margin-top: 17px; color: var(--muted); font-size: 1rem; }
          .profile-highlights { display: grid; grid-template-columns: repeat(3, 1fr); gap: 11px; margin-top: 30px; }
          .profile-highlights > div { min-width: 0; padding: 17px; border: 1px solid var(--line); border-radius: 9px; background: var(--white); }
          .profile-highlights strong, .profile-highlights span { display: block; }
          .profile-highlights strong { color: var(--green); font-size: .78rem; }
          .profile-highlights span { margin-top: 7px; color: var(--muted); font-size: .72rem; line-height: 1.5; }
          .skills-block { scroll-margin-top: 22px; margin-top: 88px; padding-top: 62px; border-top: 1px solid var(--line); }
          .skills-head h3 { margin-top: 10px; max-width: 800px; font-size: clamp(2rem, 3.5vw, 3.2rem); }
          .skills-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
          .skill-group { min-width: 0; padding: 25px; border: 1px solid var(--line); border-radius: 12px; background: var(--white); }
          .skill-number { color: #8a978e; font-size: .65rem; }
          .skill-group h4 { margin-top: 24px; font-size: 1.4rem; }
          .skill-group > p { margin-top: 10px; color: var(--muted); font-size: .8rem; max-width: 530px; }
          .skill-pills { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 21px; }
          .skill-pills span { padding: 6px 9px; border: 1px solid #d8dfd4; border-radius: 4px; background: #f7f7f0; color: #405048; font-size: .68rem; }
          #about, #skills { scroll-margin-top: 24px; }
          @media (max-width: 980px) {
            .profile-grid { grid-template-columns: minmax(240px, .65fr) 1.35fr; gap: 40px; }
            .profile-highlights { grid-template-columns: 1fr; }
          }
          @media (max-width: 760px) {
            .profile-section { padding-top: 56px; }
            .profile-grid { grid-template-columns: 1fr; }
            .profile-photo-card { max-width: 390px; }
            .profile-photo-wrap::before { inset: 20px -10px -10px 20px; }
            .experience-chip { right: -7px; bottom: 18px; }
            .profile-copy h2 { font-size: clamp(2.25rem, 11vw, 3.35rem); }
            .skills-block { margin-top: 64px; padding-top: 48px; }
            .skills-grid { grid-template-columns: 1fr; }
          }
          /* PROFILE-AND-SKILLS:END */
          ''')
          css_pattern = re.compile(r'/\* PROFILE-AND-SKILLS:START \*/.*?/\* PROFILE-AND-SKILLS:END \*/', re.S)
          if css_pattern.search(css):
              css = css_pattern.sub(profile_css, css, count=1)
          else:
              css = css.rstrip() + '\n\n' + profile_css + '\n'
          css_path.write_text(css, encoding='utf-8')

          readme_path = ROOT / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          readme = re.sub(
              r'# Harrison Madu\n(?:\n<img[^>]+>\n)?',
              '# Harrison Madu\n\n<img src="docs/assets/harrison-madu-profile.webp" alt="Harrison Madu, full-stack engineer" width="180" />\n',
              readme,
              count=1,
          )
          readme = readme.replace(
              'Full-stack developer. I build custom ERP, CRM, and inventory systems for businesses that are losing money to poor tracking, missing stock, and cash leakage.',
              'Full-stack engineer with 6 years of professional experience. I build custom ERP, CRM, inventory, reporting, and business operations systems for organizations that need better control of their workflows and data.',
          )
          new_stack = dedent('''
          ## Skills and technologies

          - **Frontend:** React, Next.js, TypeScript, JavaScript, HTML5, CSS3, Tailwind CSS, responsive UI, and UI/UX implementation.
          - **Backend and APIs:** Node.js, NestJS, REST APIs, authentication, role-based access control, API integrations, and server-side validation.
          - **Database and data:** PostgreSQL, Prisma ORM, SQL, database design, data modelling, Python, Streamlit, Plotly, and Power BI.
          - **Tools and delivery:** Git, GitHub, Visual Studio Code, Postman, Figma, CI/CD workflows, GitHub Actions, and deployment support.
          ''')
          readme = re.sub(r'## Stack\n\n.*?\n\n## Selected work', new_stack + '\n\n## Selected work', readme, count=1, flags=re.S)
          readme = readme.replace('AI-assisted development tools', '')
          readme_path.write_text(readme, encoding='utf-8')

          required = [
              ASSETS / 'harrison-madu-profile.webp',
              ROOT / 'index.html',
              DOCS / 'index.html',
              DOCS / 'assets' / 'portfolio.css',
              ROOT / 'README.md',
          ]
          for file in required:
              if not file.exists() or file.stat().st_size < 100:
                  raise RuntimeError(f'Missing or incomplete output: {file}')

          for filename in ('index.html', 'docs/index.html'):
              text = (ROOT / filename).read_text(encoding='utf-8')
              for phrase in ('Six years building software', 'Skills and technologies', 'harrison-madu-profile.webp'):
                  if phrase not in text:
                      raise RuntimeError(f'{filename} is missing required content: {phrase}')
              if 'AI-assisted development tools' in text:
                  raise RuntimeError(f'{filename} still contains removed wording')
          PY

      - name: Commit portfolio profile update
        shell: bash
        run: |
          rm -f .github/workflows/add-profile-and-skills.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add professional profile and technology stack"
          git push origin HEAD:main
